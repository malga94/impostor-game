<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impostor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 0.9em;
        }

        .form-section {
            margin-top: 30px;
        }

        .form-title {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .player-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .player-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .player-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-remove {
            background: #ff6b6b;
            color: white;
        }

        .btn-remove:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .btn-add:active, .btn-remove:active {
            transform: scale(0.95);
        }

        .add-player-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-add-player {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add-player:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-add-player:active {
            transform: translateY(0);
        }

        .player-count {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .impostor-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .impostor-label {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .impostor-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .impostor-input {
            width: 80px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.2em;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
        }

        .impostor-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-increment, .btn-decrement {
            background: #667eea;
            color: white;
            width: 45px;
            height: 45px;
            padding: 0;
        }

        .btn-increment:hover, .btn-decrement:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-increment:active, .btn-decrement:active {
            transform: scale(0.95);
        }

        .btn-increment:disabled, .btn-decrement:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-play {
            width: 100%;
            padding: 18px;
            margin-top: 35px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.3);
        }

        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-play:active {
            transform: translateY(-1px);
        }

        /* Custom Words Section */
        .custom-words-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .section-title {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .optional-label {
            color: #999;
            font-size: 0.85em;
            font-weight: 400;
        }

        .custom-word-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .custom-word-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .custom-word-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-add-word {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add-word:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-add-word:active {
            transform: translateY(0);
        }

        .file-upload-group {
            margin-bottom: 15px;
        }

        .file-upload-label {
            display: inline-block;
            padding: 10px 20px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
            color: #666;
        }

        .file-upload-label:hover {
            background: #ebebeb;
            border-color: #667eea;
            color: #667eea;
        }

        .file-upload-label input[type="file"] {
            display: none;
        }

        .custom-words-list-container {
            margin-bottom: 15px;
        }

        .custom-words-list-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        .custom-words-list-header.visible {
            display: flex;
        }

        .custom-words-count {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        .btn-remove-all {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-remove-all:hover {
            background: #ee5a52;
            transform: translateY(-1px);
        }

        .btn-remove-all:active {
            transform: translateY(0);
        }

        .custom-words-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 10px;
            display: none;
        }

        .custom-words-list.has-words {
            display: block;
        }

        .custom-word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .custom-word-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .custom-word-text {
            color: #333;
            font-weight: 500;
        }

        .btn-remove-word {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-remove-word:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .checkbox-group {
            margin-top: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #666;
            font-size: 0.95em;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Game view styles */
        .game-view {
            display: none;
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .game-view.active {
            display: flex;
        }

        .setup-view.hidden {
            display: none;
        }

        .player-reveal {
            width: 100%;
        }

        .reveal-title {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-name-display {
            font-size: 3em;
            font-weight: 700;
            color: #333;
            margin: 30px 0;
            animation: fadeIn 0.5s ease-in;
        }

        .role-display {
            font-size: 2.5em;
            font-weight: 700;
            margin: 20px 0;
            padding: 30px;
            border-radius: 15px;
            animation: fadeIn 0.5s ease-in;
        }

        .role-actor {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .role-impostor {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .word-display {
            font-size: 3.5em;
            font-weight: 700;
            color: #667eea;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tap-instruction {
            color: #999;
            font-size: 1em;
            margin-top: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .game-complete {
            text-align: center;
        }

        .complete-title {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .complete-message {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .btn-new-game {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-new-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .language-selector select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .language-selector select:hover {
            border-color: #667eea;
        }

        .language-selector select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2.5em;
            }

            .btn-play {
                font-size: 1.3em;
            }

            .player-name-display {
                font-size: 2em;
                margin: 20px 0;
            }

            .role-display {
                font-size: 1.8em;
                padding: 20px;
            }

            .word-display {
                font-size: 2em;
                letter-spacing: 1px;
                margin-top: 15px;
                word-wrap: break-word;
                overflow-wrap: break-word;
                max-width: 100%;
            }

            .complete-title {
                font-size: 1.8em;
            }

            .section-title {
                font-size: 1em;
            }

            .custom-word-input-group {
                flex-direction: column;
                gap: 8px;
            }

            .btn-add-word {
                width: 100%;
            }

            .file-upload-label {
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }

            .checkbox-label {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-selector">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="english">English</option>
                <option value="italian">Italiano</option>
            </select>
        </div>

        <div class="setup-view">
            <h1>The Impostor</h1>
            <p class="subtitle">Enter player names to start the game</p>

            <div class="form-section">
            <div id="playerInputs">
                <div class="player-input-group">
                    <input type="text" class="player-input" placeholder="Player 1" data-player="1">
                    <button class="btn btn-add" onclick="addPlayer()" title="Add player">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <p class="player-count">Players: <span id="playerCount">1</span></p>
        </div>

        <div class="impostor-section">
            <div class="impostor-label">Number of Impostors</div>
            <div class="impostor-input-group">
                <button class="btn btn-decrement" onclick="decrementImpostor()" title="Decrease impostors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                </button>
                <input type="number" id="impostorInput" class="impostor-input" value="1" min="1" max="1" onchange="validateImpostorCount()">
                <button class="btn btn-increment" onclick="incrementImpostor()" title="Increase impostors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Custom Words Section -->
        <div class="custom-words-section">
            <h3 class="section-title">Custom Words <span class="optional-label">(Optional)</span></h3>

            <div class="custom-word-input-group">
                <input type="text" id="customWordInput" class="custom-word-input" placeholder="Add a custom word...">
                <button class="btn-add-word" onclick="addCustomWord()">Add</button>
            </div>

            <div class="file-upload-group">
                <label for="csvUpload" class="file-upload-label">
                    <span>📁 Upload CSV file</span>
                    <input type="file" id="csvUpload" accept=".csv" onchange="handleCSVUpload(event)">
                </label>
            </div>

            <div class="custom-words-list-container">
                <div class="custom-words-list-header" id="customWordsHeader">
                    <span class="custom-words-count" id="customWordsCount"></span>
                    <button class="btn-remove-all" onclick="removeAllCustomWords()">Remove All</button>
                </div>
                <div class="custom-words-list" id="customWordsList"></div>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="useOnlyCustomWords">
                    <span>Use only custom words (ignore default words)</span>
                </label>
            </div>
        </div>

        <button class="btn-play" onclick="startGame()">Play</button>
        </div>

        <div class="game-view" id="gameView" onclick="handleGameClick()">
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        let playerCount = 1;

        function addPlayer() {
            playerCount++;
            const playerInputs = document.getElementById('playerInputs');

            const inputGroup = document.createElement('div');
            inputGroup.className = 'player-input-group';

            inputGroup.innerHTML = `
                <input type="text" class="player-input" placeholder="Player ${playerCount}" data-player="${playerCount}">
                <button class="btn btn-remove" onclick="removePlayer(this)" title="Remove player">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            `;

            playerInputs.appendChild(inputGroup);
            updatePlayerCount();

            // Focus on the new input
            const newInput = inputGroup.querySelector('.player-input');
            newInput.focus();
        }

        function removePlayer(button) {
            const inputGroup = button.parentElement;
            inputGroup.style.animation = 'slideOut 0.3s ease-out';

            setTimeout(() => {
                inputGroup.remove();
                updatePlayerCount();
                renumberPlayers();
            }, 300);
        }

        function updatePlayerCount() {
            const inputs = document.querySelectorAll('.player-input');
            playerCount = inputs.length;
            document.getElementById('playerCount').textContent = playerCount;
            updateImpostorMax();
        }

        function renumberPlayers() {
            const inputs = document.querySelectorAll('.player-input');
            inputs.forEach((input, index) => {
                const playerNumber = index + 1;
                input.setAttribute('data-player', playerNumber);
                input.setAttribute('placeholder', `Player ${playerNumber}`);
            });
        }

        // Add animation for removal
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOut {
                to {
                    opacity: 0;
                    transform: translateX(20px);
                }
            }
        `;
        document.head.appendChild(style);

        // Impostor count functions
        function updateImpostorMax() {
            const impostorInput = document.getElementById('impostorInput');
            const currentValue = parseInt(impostorInput.value);

            // Update max attribute
            impostorInput.max = playerCount;

            // If current value exceeds player count, adjust it
            if (currentValue > playerCount) {
                impostorInput.value = playerCount;
            }

            updateImpostorButtons();
        }

        function validateImpostorCount() {
            const impostorInput = document.getElementById('impostorInput');
            let value = parseInt(impostorInput.value);

            // Ensure value is a number
            if (isNaN(value)) {
                value = 1;
            }

            // Clamp value between 1 and playerCount
            if (value < 1) {
                value = 1;
            } else if (value > playerCount) {
                value = playerCount;
            }

            impostorInput.value = value;
            updateImpostorButtons();
        }

        function incrementImpostor() {
            const impostorInput = document.getElementById('impostorInput');
            let value = parseInt(impostorInput.value);

            if (value < playerCount) {
                impostorInput.value = value + 1;
                updateImpostorButtons();
            }
        }

        function decrementImpostor() {
            const impostorInput = document.getElementById('impostorInput');
            let value = parseInt(impostorInput.value);

            if (value > 1) {
                impostorInput.value = value - 1;
                updateImpostorButtons();
            }
        }

        function updateImpostorButtons() {
            const impostorInput = document.getElementById('impostorInput');
            const value = parseInt(impostorInput.value);
            const decrementBtn = document.querySelector('.btn-decrement');
            const incrementBtn = document.querySelector('.btn-increment');

            // Disable decrement if at minimum
            decrementBtn.disabled = value <= 1;

            // Disable increment if at maximum
            incrementBtn.disabled = value >= playerCount;
        }

        // Word list for the game (loaded from CSV)
        let wordList = [];
        let currentLanguage = 'english';

        // Load words from CSV file
        async function loadWords(language) {
            try {
                const response = await fetch(`http://localhost:8000/words/words_${language}.csv`);
                const text = await response.text();
                wordList = text.split('\n')
                    .map(word => word.trim())
                    .filter(word => word.length > 0);
                console.log(`Loaded ${wordList.length} words from ${language} CSV`);
            } catch (error) {
                console.error('Error loading words:', error);
                // Fallback to a basic word list if CSV fails to load
                wordList = ['Pizza', 'Ocean', 'Guitar', 'Mountain', 'Robot'];
                alert('Could not load word list. Using default words.');
            }
        }

        // Change language
        function changeLanguage() {
            const languageSelect = document.getElementById('languageSelect');
            currentLanguage = languageSelect.value;
            loadWords(currentLanguage);
        }

        // Load words when page loads (default to English)
        loadWords(currentLanguage);

        // Custom words functionality
        let customWords = [];

        function addCustomWord() {
            const input = document.getElementById('customWordInput');
            const word = input.value.trim();

            if (word === '') {
                return;
            }

            // Check for duplicates
            if (customWords.includes(word)) {
                alert('This word is already in your custom list!');
                return;
            }

            customWords.push(word);
            input.value = '';
            renderCustomWords();
            input.focus();
        }

        function removeCustomWord(index) {
            customWords.splice(index, 1);
            renderCustomWords();
        }

        function renderCustomWords() {
            const listContainer = document.getElementById('customWordsList');
            const headerContainer = document.getElementById('customWordsHeader');
            const countElement = document.getElementById('customWordsCount');

            if (customWords.length === 0) {
                listContainer.classList.remove('has-words');
                listContainer.innerHTML = '';
                headerContainer.classList.remove('visible');
                return;
            }

            // Update count and show header
            countElement.textContent = `${customWords.length} custom word${customWords.length !== 1 ? 's' : ''}`;
            headerContainer.classList.add('visible');

            // Render word list
            listContainer.classList.add('has-words');
            listContainer.innerHTML = customWords.map((word, index) => `
                <div class="custom-word-item">
                    <span class="custom-word-text">${word}</span>
                    <button class="btn-remove-word" onclick="removeCustomWord(${index})">Remove</button>
                </div>
            `).join('');
        }

        function removeAllCustomWords() {
            if (customWords.length === 0) return;

            if (confirm(`Are you sure you want to remove all ${customWords.length} custom word${customWords.length !== 1 ? 's' : ''}?`)) {
                customWords = [];
                renderCustomWords();
            }
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const words = text.split('\n')
                    .map(word => word.trim())
                    .filter(word => word.length > 0);

                // Add words that aren't already in the list
                let addedCount = 0;
                words.forEach(word => {
                    if (!customWords.includes(word)) {
                        customWords.push(word);
                        addedCount++;
                    }
                });

                renderCustomWords();
                alert(`Added ${addedCount} word(s) from CSV file!`);

                // Reset file input
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // Allow Enter key to add custom word
        document.addEventListener('DOMContentLoaded', function() {
            const customWordInput = document.getElementById('customWordInput');
            if (customWordInput) {
                customWordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addCustomWord();
                    }
                });
            }
        });

        // Game state
        let gameState = {
            players: [],
            currentPlayerIndex: 0,
            showingRole: false,
            word: ''
        };

        function startGame() {
            // Get all player names
            const playerInputs = document.querySelectorAll('.player-input');
            const playerNames = Array.from(playerInputs).map(input => input.value.trim()).filter(name => name !== '');

            // Get impostor count
            const impostorCount = parseInt(document.getElementById('impostorInput').value);

            // Validate that we have at least one player with a name
            if (playerNames.length === 0) {
                alert('Please enter at least one player name!');
                return;
            }

            // Determine which word list to use
            const useOnlyCustomWords = document.getElementById('useOnlyCustomWords').checked;
            let availableWords = [];

            if (useOnlyCustomWords) {
                // Use only custom words
                if (customWords.length === 0) {
                    alert('Please add at least one custom word, or uncheck "Use only custom words"!');
                    return;
                }
                availableWords = customWords;
            } else {
                // Merge custom words with language word list
                if (wordList.length === 0) {
                    alert('Words are still loading, please wait a moment...');
                    return;
                }
                availableWords = [...wordList, ...customWords];
            }

            // Validate we have at least one word
            if (availableWords.length === 0) {
                alert('No words available! Please add custom words or select a language.');
                return;
            }

            // Choose a random word
            const word = availableWords[Math.floor(Math.random() * availableWords.length)];

            // Create array of roles
            const roles = [];
            for (let i = 0; i < impostorCount; i++) {
                roles.push('impostor');
            }
            for (let i = 0; i < playerNames.length - impostorCount; i++) {
                roles.push('actor');
            }

            // Shuffle roles using Fisher-Yates algorithm
            for (let i = roles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roles[i], roles[j]] = [roles[j], roles[i]];
            }

            // Create player objects
            gameState.players = playerNames.map((name, index) => ({
                name: name,
                role: roles[index]
            }));
            gameState.word = word;
            gameState.currentPlayerIndex = 0;
            gameState.showingRole = false;

            // Hide setup view and show game view
            document.querySelector('.setup-view').classList.add('hidden');
            document.getElementById('gameView').classList.add('active');

            // Show first player's name
            showPlayerName();
        }

        function showPlayerName() {
            const player = gameState.players[gameState.currentPlayerIndex];
            const gameContent = document.getElementById('gameContent');

            gameContent.innerHTML = `
                <div class="player-reveal">
                    <div class="reveal-title">Pass the device to:</div>
                    <div class="player-name-display">${player.name}</div>
                    <div class="tap-instruction">Tap anywhere to reveal your role</div>
                </div>
            `;
        }

        function showPlayerRole() {
            const player = gameState.players[gameState.currentPlayerIndex];
            const gameContent = document.getElementById('gameContent');

            if (player.role === 'actor') {
                gameContent.innerHTML = `
                    <div class="player-reveal">
                        <div class="role-display role-actor">
                            You are an ACTOR
                        </div>
                        <div class="word-display">${gameState.word}</div>
                        <div class="tap-instruction">Remember the word, then tap to continue</div>
                    </div>
                `;
            } else {
                gameContent.innerHTML = `
                    <div class="player-reveal">
                        <div class="role-display role-impostor">
                            You are an IMPOSTOR
                        </div>
                        <div style="font-size: 1.2em; color: #666; margin-top: 20px;">
                            You don't know the word!<br>Try to blend in with the actors.
                        </div>
                        <div class="tap-instruction">Tap to continue</div>
                    </div>
                `;
            }
        }

        function showGameComplete() {
            const gameContent = document.getElementById('gameContent');
            const actorCount = gameState.players.filter(p => p.role === 'actor').length;
            const impostorCount = gameState.players.filter(p => p.role === 'impostor').length;

            // Randomly select a player to start
            const startingPlayerIndex = Math.floor(Math.random() * gameState.players.length);
            const startingPlayer = gameState.players[startingPlayerIndex];

            gameContent.innerHTML = `
                <div class="game-complete">
                    <div class="complete-title">All Players Ready!</div>
                    <div class="complete-message">
                        ${actorCount} Actor${actorCount !== 1 ? 's' : ''} vs ${impostorCount} Impostor${impostorCount !== 1 ? 's' : ''}
                    </div>
                    <div class="complete-message" style="margin-top: 30px; font-size: 1.3em;">
                        <strong style="color: #667eea;">${startingPlayer.name}</strong> starts the discussion!
                    </div>
                    <div class="complete-message">
                        Try to find the impostor${impostorCount !== 1 ? 's' : ''}!
                    </div>
                    <button class="btn-new-game" onclick="resetGame()">New Game</button>
                </div>
            `;
        }

        function handleGameClick() {
            if (!gameState.showingRole) {
                // Currently showing player name, now show role
                gameState.showingRole = true;
                showPlayerRole();
            } else {
                // Currently showing role, move to next player or end game
                gameState.currentPlayerIndex++;
                gameState.showingRole = false;

                if (gameState.currentPlayerIndex < gameState.players.length) {
                    // Show next player's name
                    showPlayerName();
                } else {
                    // All players done, show completion
                    showGameComplete();
                }
            }
        }

        function resetGame() {
            // Reset game state
            gameState = {
                players: [],
                currentPlayerIndex: 0,
                showingRole: false,
                word: ''
            };

            // Clear game content
            document.getElementById('gameContent').innerHTML = '';

            // Show setup view and hide game view
            document.querySelector('.setup-view').classList.remove('hidden');
            document.getElementById('gameView').classList.remove('active');
        }

        // Initialize impostor buttons on page load
        updateImpostorButtons();
    </script>
</body>
</html>
